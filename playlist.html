<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playlist — For My Princess 🎧</title>
  <style>
    :root{--bg:#fff6fb;--card:#fff;--panel:#fff0ea;--accent:#ff4d9e;--muted:#7a6b7a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff6fb,#fff0f6);font-family:Inter,system-ui,Arial;color:#222}
    .wrap{max-width:1100px;margin:48px auto;padding:28px}
    .hero{text-align:center;margin-bottom:18px}
    h1{color:var(--accent);margin:0;font-size:22px}
    .sub{color:var(--muted);margin-top:6px}

    .panel{background:linear-gradient(180deg,#fffafa,#fff7f0);padding:26px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,0.06)}

    /* top mini player (hidden until play) */
    .mini-player{display:none;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.03);margin-bottom:18px}
    .mini-player.show{display:flex}
    .mini-row{display:flex;align-items:center;gap:14px}
    .mini-cover{width:56px;height:56px;border-radius:8px;flex:0 0 56px;overflow:hidden}
    .mini-meta{flex:1;min-width:0}
    .meta-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta-sub{color:var(--muted);font-size:13px}
    .mini-controls{display:flex;align-items:center;gap:10px}
    .btn-circle{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}

    .progress-row{display:flex;align-items:center;gap:12px}
    .time{color:var(--muted);font-size:13px;width:48px;text-align:center}
    .progress{flex:1}
    .progress input[type=range]{width:100%}

    /* grid of cards */
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:18px}
    .card{background:var(--card);border-radius:12px;padding:14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.06);cursor:pointer;border:2px solid transparent;transition:transform .18s,box-shadow .18s;border-radius:14px}
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 44px rgba(0,0,0,0.08)}
    .card.active{border-color:rgba(255,77,158,0.18);box-shadow:0 18px 44px rgba(255,77,158,0.06)}
    .cover{width:100%;height:220px;object-fit:cover;border-radius:10px}
    .title{font-weight:700;margin-top:12px}
    .desc{color:var(--muted);font-size:13px;margin-top:6px}

    .center-btn{display:block;margin:24px auto 0;background:linear-gradient(90deg,var(--accent),#ff9fc4);color:white;padding:14px 22px;border-radius:999px;border:none;font-weight:700;cursor:pointer}

    /* Responsive tweaks */
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.cover{height:200px}}
    @media(max-width:600px){
      .wrap{margin:20px;padding:16px}
      .cards{grid-template-columns:1fr}
      .cover{height:160px}
      .mini-row{gap:10px}
      .btn-circle{width:44px;height:44px}
    }

    /* make range input prettier across browsers */
    input[type=range]{-webkit-appearance:none;background:transparent}
    input[type=range]::-webkit-slider-runnable-track{height:6px;background:#eee;border-radius:6px}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-4px}
    input[type=range]::-moz-range-track{height:6px;background:#eee;border-radius:6px}
    input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>A Dedicated Playlist For You</h1>
      <div class="sub">Choose a track to start vibing ✨</div>
    </div>

    <div class="panel">
      <div id="miniPlayer" class="mini-player" aria-hidden="true">
        <div class="mini-row">
          <img id="miniCover" class="mini-cover" src="https://via.placeholder.com/150/ffb3d6/fff?text=♪" alt="cover">
          <div class="mini-meta">
            <div id="miniTitle" class="meta-title">Track title</div>
            <div id="miniSub" class="meta-sub">Artist • 0:00</div>
          </div>
          <div class="mini-controls">
            <button id="prevBtn" class="btn-circle" aria-label="Previous">◄</button>
            <button id="playPauseBtn" class="btn-circle" aria-label="Play">▶</button>
            <button id="nextBtn" class="btn-circle" aria-label="Next">►</button>
          </div>
        </div>

        <div class="progress-row">
          <div id="currentTime" class="time">0:00</div>
          <div class="progress"><input id="seekBar" type="range" min="0" max="100" value="0"></div>
          <div id="durationTime" class="time">0:00</div>
        </div>
      </div>

      <div class="cards" id="cards">
        <!-- cards will be generated by JS -->
      </div>

      <button class="center-btn" id="continueBtn">Continue to Next ✨</button>
    </div>
  </div>

  <script>
    // Sample playlist data (replace images and audio with your own later)
    const playlist = [
      {id:0,title:'Jab se Tere Naina',desc:"Pagal Deewana Hua",img:'./media/images/IMG-20251104-WA0008.jpg',src:'./media/audio/jab-se-tere-naina.mp3'},
      {id:1,title:"Jugraafiya",desc:"Tujhse jo milke maza hai kha wo ganit ke sawalo me hai",img:'./media/images/kitty-spider.jpg',src:'./media/audio/jugraafiya.mp3'},
      {id:2,title:'Dil ka Jo Haal hai',desc:'Tu Kaare Dil Bekarar',img:'./media/images/spider-cat.jpg',src:'./media/audio/dil-ka-jo-haal-hai.mp3'}
    ];

    const cardsContainer = document.getElementById('cards');
    const miniPlayer = document.getElementById('miniPlayer');
    const miniTitle = document.getElementById('miniTitle');
    const miniSub = document.getElementById('miniSub');
    const miniCover = document.getElementById('miniCover');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');

    let audio = new Audio();
    audio.preload = 'metadata';
    let current = null;
    let isPlaying = false;
    let seeking = false;

    function formatTime(secs){
      if(isNaN(secs)) return '0:00';
      const m = Math.floor(secs/60); const s = Math.floor(secs%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    function renderCards(){
      playlist.forEach(track=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = track.id;
        card.innerHTML = `
          <img class="cover" src="${track.img}" alt="${track.title}">
          <div class="title">${track.title}</div>
          <div class="desc">${track.desc}</div>
        `;
        card.addEventListener('click', ()=> selectTrack(track.id));
        cardsContainer.appendChild(card);
      });
    }

    function selectTrack(id){
      const track = playlist.find(t=>t.id===id);
      if(!track) return;
      // highlight
      document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active', Number(c.dataset.id)===id));

      // if same track, toggle play/pause using audio.paused
      if(current === id){
        if(!audio.paused){ audio.pause(); }
        else { audio.play().catch(()=>{}); }
        return;
      }

      current = id;
      // set audio src and play
      audio.src = track.src;
      audio.load();
      audio.play().catch(()=>{});

      // show mini player
      miniPlayer.classList.add('show');
      miniPlayer.setAttribute('aria-hidden','false');
      miniTitle.textContent = track.title;
      miniSub.textContent = track.desc + ' • 0:00';
      miniCover.src = track.img;

      // reset seekbar
      seekBar.value = 0;
      seekBar.min = 0;
      seekBar.max = 100;
      currentTimeEl.textContent = '0:00';
      durationTimeEl.textContent = '0:00';

      // when metadata loaded, set duration
      audio.onloadedmetadata = ()=>{
        seekBar.max = Math.floor(audio.duration);
        durationTimeEl.textContent = formatTime(audio.duration);
      };

      // attach timeupdate
      audio.ontimeupdate = ()=>{
        // update play/pause state UI
        if(!audio.paused){ playPauseBtn.textContent = '❚❚'; }
        else { playPauseBtn.textContent = '▶'; }

        if(!seeking){
          seekBar.value = Math.floor(audio.currentTime);
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      };

      audio.onplay = ()=>{ isPlaying = true; playPauseBtn.textContent='❚❚'; };
      audio.onpause = ()=>{ isPlaying = false; playPauseBtn.textContent='▶'; };
      audio.onended = ()=>{ isPlaying=false; playPauseBtn.textContent='▶'; };
    }

    playPauseBtn.addEventListener('click', ()=>{
      if(current===null) return;
      if(audio.paused){ audio.play().catch(()=>{}); }
      else { audio.pause(); }
    });

    prevBtn.addEventListener('click', ()=>{
      if(current===null) return;
      const idx = playlist.findIndex(p=>p.id===current);
      const prev = (idx-1+playlist.length)%playlist.length;
      selectTrack(playlist[prev].id);
    });
    nextBtn.addEventListener('click', ()=>{
      if(current===null) return;
      const idx = playlist.findIndex(p=>p.id===current);
      const next = (idx+1)%playlist.length;
      selectTrack(playlist[next].id);
    });

    // Seekbar interactions
    seekBar.addEventListener('input', (e)=>{
      const val = Number(e.target.value);
      currentTimeEl.textContent = formatTime(val);
      seeking = true;
    });
    seekBar.addEventListener('change', (e)=>{
      const val = Number(e.target.value);
      audio.currentTime = val;
      seeking = false;
    });

    // Touch-friendly: allow tapping the card to toggle play/pause on mobile as well
    cardsContainer.addEventListener('touchstart', (e)=>{
      const card = e.target.closest('.card');
      if(card) card.focus && card.focus();
    }, {passive:true});

    // Continue button jumps to an anchor or next page - placeholder
    document.getElementById('continueBtn').addEventListener('click', ()=>{
      alert('Continue action placeholder — replace with your next page');
    });

    renderCards();
  </script>
</body>
</html>
